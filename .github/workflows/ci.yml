name: ci
on:
  push:
    branches: [main, mvp]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.2.19" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .
      - run: bunx tsc --noEmit -p tsconfig.json
      - name: Build (mock ARAG, no credentials needed)
        run: ARAG_MOCK=1 bunx next build
      - name: Unit + integration + contract tests with coverage gate
        run: bunx vitest run --coverage
      - name: Dependency audit (fails on un-waived high/critical advisories)
        run: node scripts/audit.ts --level high

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.2.19" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: ARAG_MOCK=1 bunx next build
      - name: Playwright (demo + admin)
        run: PW_CHANNEL= PW_DISABLE_TS_ESM=1 bunx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: test-results }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t call-analysis:ci .
